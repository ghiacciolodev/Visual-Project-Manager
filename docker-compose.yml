services:
  db:
    image: postgres:16-alpine
    container_name: vpm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpm}
      POSTGRES_USER: ${POSTGRES_USER:-vpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpm_local_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The backend must not start before the database is accepting
      # connections. "container running" is not the same as "ready".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpm} -d ${POSTGRES_DB:-vpm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-db:
    image: postgres:16-alpine
    container_name: vpm-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local_dev}
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak gets its own database rather than sharing the application's.
  # An identity provider's schema is its own business: mixing them means a
  # Flyway migration and a Keycloak upgrade can collide over the same tables.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: vpm-keycloak
    restart: unless-stopped
    # start-dev is development only: it disables HTTPS enforcement and runs an
    # in-memory cache. A deployed instance uses `start` with a certificate.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local_dev}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      # The realm is version-controlled and imported on start, so the whole
      # identity setup is reproducible with one command instead of a page of
      # click-here instructions.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # KC_HEALTH_ENABLED exposes this on the management port. Without a check,
      # the container reports "Up" as soon as the socket binds, which is well
      # before Keycloak can answer anything.
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

volumes:
  pgdata:
  keycloak-pgdata:
