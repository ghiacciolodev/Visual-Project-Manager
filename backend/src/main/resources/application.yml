spring:
  application:
    name: vpm

  profiles:
    default: dev

  datasource:
    # Defaults match .env.example so the app starts with zero configuration.
    # Docker Compose reads .env automatically; Spring Boot does not.
    #
    # In a container this whole value is replaced by SPRING_DATASOURCE_URL,
    # which points at the "db" service instead of localhost — inside a
    # container, localhost is the container itself.
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:vpm}
    username: ${POSTGRES_USER:vpm}
    password: ${POSTGRES_PASSWORD:vpm_local_dev}

  jpa:
    hibernate:
      # "validate", not "update": Flyway owns the schema. With "update"
      # Hibernate silently alters the database and migrations stop being
      # the source of truth. Better to fail fast on startup when the
      # entities and the schema disagree.
      ddl-auto: validate
    # Prevents lazy queries from firing while the response is being
    # rendered, outside the transaction. Turning it off is the right
    # default for an API.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    # No stack traces and no internal messages leak to the client.
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # Only health is exposed. The other actuator endpoints leak
        # configuration, beans and environment variables.
        include: health
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

  # Writes only, per caller, refilling continuously. Reads are what a person
  # does by having the page open; writes are what grows the database and sets
  # the dependency and critical-path work going.
  #
  # 120 a minute is well above anything a human does through the interface —
  # dragging a bar across a month is one request — and low enough to stop a
  # script. Lower it to something small to see the 429 for yourself.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:120}
    period: ${RATE_LIMIT_PERIOD:1m}

  # How fast is only half the question. At 120 writes a minute one account can
  # add something like a hundred and seventy thousand rows a day and keep
  # going, and registration is open, so that account costs an email address.
  # These are the ceilings, set far above anything honest: a two-thousand-task
  # plan is already past the point where this application's rendering is the
  # thing to fix.
  limits:
    tasks-per-project: ${LIMIT_TASKS_PER_PROJECT:2000}
    members-per-project: ${LIMIT_MEMBERS_PER_PROJECT:100}
    projects-per-user: ${LIMIT_PROJECTS_PER_USER:100}

  # Keycloak is addressed by two different URLs, and the split is deliberate.
  #
  # The browser reaches it at localhost:8081, so that is the issuer written
  # into every token. A containerised backend cannot resolve that address —
  # localhost is its own loopback — and reaches Keycloak at keycloak:8080
  # over the compose network instead.
  #
  # So the keys are fetched over the internal address while the issuer claim
  # is checked against the public one. Using the internal address for both
  # would reject every real token; skipping the issuer check would accept
  # tokens minted by any realm on that server.
  keycloak:
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/vpm}
    # Empty outside containers, where one address serves both purposes and
    # OIDC discovery can find the keys on its own.
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

---
# ============================================================
# dev profile: shows the generated SQL and this application's
# own reasoning. The default when nothing says otherwise, which
# is what a developer starting the app locally wants.
# ============================================================
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    it: DEBUG
    org.hibernate.SQL: DEBUG

---
# ============================================================
# prod profile: quiet.
#
# Added because the containers were running the dev one. Nothing in
# docker-compose.yml set a profile, spring.profiles.default is dev, and
# logging.level.it: DEBUG sat in the base section where every profile
# inherited it — so a containerised backend logged every statement it
# executed, complete with the parameters.
# ============================================================
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    it: INFO
    org.hibernate.SQL: WARN
