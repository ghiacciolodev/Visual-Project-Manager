# The login pages, in the application's own clothes.
#
# parent=keycloak.v2 inherits every FreeMarker template and every PatternFly
# class name, so nothing here has to reimplement a login form, a password
# toggle or an error state. Only the paint changes.
#
# styles is a full override, not an append: keycloak.v2 declares
# `styles=css/styles.css`, so dropping that name here would leave the page with
# no base stylesheet at all and a heap of unstyled PatternFly markup. The
# parent's sheet loads first and vpm.css overrides it.
#
# stylesCommon is deliberately not redeclared — it carries the PatternFly
# bundle and is inherited untouched.

parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/vpm.css
