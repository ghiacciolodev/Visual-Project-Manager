server {
    listen 80;
    server_name _;

    # nginx does not advertise its version. Not a defence in itself, but a
    # version number in a header is a free shortlist of which advisories to try.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Every unknown path falls back to index.html so the Angular router can
        # handle it. Without this, reloading on /gantt asks nginx for a file
        # that does not exist and gets a 404 — the classic single-page
        # application deployment bug.
        try_files $uri $uri/ /index.html;

        include /etc/nginx/vpm-security-headers.conf;
    }

    # Hashed filenames are immutable by construction, so they can be cached
    # indefinitely. index.html must not be: it is what points at the new
    # hashes after a deploy.
    location ~* \.(js|css|woff2?|png|svg|jpg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        # Repeated, and it has to be. `add_header` in a location replaces the
        # inherited set rather than extending it, so without this line the one
        # above would strip every security header from precisely the scripts
        # and stylesheets that need nosniff most.
        include /etc/nginx/vpm-security-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
