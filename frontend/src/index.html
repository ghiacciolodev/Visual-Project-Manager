<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Visual Project Manager</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plan the work and see what it costs: a scheduling sheet with a Gantt chart, dependencies and the critical path.">
  <!-- SVG rather than .ico: one file that stays sharp at every size a tab,
       a bookmark or a pinned shortcut asks for. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- The typeface is served from this host. It came from Google until the
       demo went public, and a tool that says the data stays here should not
       open by introducing the visitor's browser to somebody else. The
       @font-face rules and the reasoning are at the top of styles.scss.

       Preloaded because it is discovered late otherwise: the browser only
       learns the font exists after it has fetched and parsed the stylesheet
       that names it, which is one round trip of unstyled text. Only the one
       file almost every visitor needs; the rest are fetched when a character
       calls for them. -->
  <link rel="preload" href="fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <app-root></app-root>
</body>
</html>
