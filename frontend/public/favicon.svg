<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="VPM">
  <!--
    The schedule in miniature: staggered bars under the red cursor that marks
    the present. Same tokens as the application — ink, paper, and the one
    saturated colour the system reserves for "now". Squared off, no radii.
  -->
  <rect width="32" height="32" fill="#14202b"/>

  <rect x="4"  y="7"  width="15" height="5" fill="#f7f9fa"/>
  <rect x="10" y="14" width="15" height="5" fill="#f7f9fa"/>
  <rect x="7"  y="21" width="10" height="5" fill="#8fa1af"/>

  <rect x="20" y="3"  width="2"  height="26" fill="#c4331d"/>
</svg>
