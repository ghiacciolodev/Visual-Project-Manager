<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="VPM">
  <!--
    A schedule in miniature: three staggered bars, each starting where the
    reader's eye expects the next piece of work to begin. Drawn in the brand
    blue with the bars stepping down in weight, so it still reads at 16px
    where a four-element mark would turn to mud.
  -->
  <rect width="32" height="32" rx="8" fill="#2f5bd8"/>

  <rect x="7"  y="9"  width="16" height="4.5" rx="2.25" fill="#ffffff"/>
  <rect x="11" y="15" width="14" height="4.5" rx="2.25" fill="#ffffff" opacity="0.72"/>
  <rect x="7"  y="21" width="9"  height="4.5" rx="2.25" fill="#ffffff" opacity="0.45"/>
</svg>
