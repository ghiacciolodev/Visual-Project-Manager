name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest

    # No postgres service any more: the tests start their own through
    # Testcontainers, which the runner's Docker daemon provides. One database
    # per test run, torn down with it, and no second place where the version
    # has to be kept in step.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The executable bit on mvnw is routinely lost when committing from
      # Windows, and the Linux runner then cannot launch the wrapper.
      - name: Make the Maven wrapper executable
        run: chmod +x ./mvnw
        working-directory: backend

      - name: Build and test
        run: ./mvnw -B verify
        working-directory: backend

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # "npm ci" and not "npm install": it installs exactly what the lockfile
      # says and fails loudly when package.json and the lockfile disagree,
      # which is a real problem worth failing on rather than papering over.
      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # --watch=false because the builder watches by default, and a watching
      # test run on a CI runner is a job that never finishes.
      - name: Unit tests
        run: npm test -- --watch=false
        working-directory: frontend

      # Advisories are worth knowing about and are not worth failing a build
      # over at every severity: every one currently in the tree arrives through
      # @angular/build and @angular/cli, which are devDependencies and reach no
      # shipped file. The threshold is set where a finding would actually mean
      # something.
      - name: Audit dependencies
        run: npm audit --audit-level=critical
        working-directory: frontend

      - name: Production build
        run: npm run build
        working-directory: frontend

  stack:
    name: Stack and end to end (docker compose)
    runs-on: ubuntu-latest

    # Neither job above builds an image, so a broken Dockerfile or a stale
    # nginx configuration would pass CI and fail on somebody's laptop. This
    # builds both, starts the stack, and then drives a browser through it.
    #
    # The browser half is here rather than in a job of its own because the
    # stack takes minutes to build and the end-to-end run needs exactly the
    # stack this job already has. Two jobs would build it twice.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # --with-deps because a runner has none of the shared libraries a
      # headless browser needs, and the failure without it is a linker error
      # rather than a test failure.
      - name: Install the browser Playwright drives
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build the images
        run: docker compose build

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d

      # The backend waits on Keycloak's health check, which waits on its
      # database, so this is the whole chain in one assertion.
      - name: Wait for the API to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "API is up"; exit 0
            fi
            sleep 5
          done
          echo "API never came up"; docker compose logs --tail=80; exit 1

      # The security headers exist because they were verified against the built
      # image once. This is what keeps them verified.
      - name: Check the frontend's response headers
        run: |
          headers=$(curl -fsSI http://localhost:4200/)
          echo "$headers"
          for header in "content-security-policy" "x-content-type-options" \
                        "referrer-policy" "x-frame-options"; do
            echo "$headers" | grep -iq "^$header:" || { echo "missing $header"; exit 1; }
          done

      # The end-to-end run asserts on the seeded plan by name and by count, so
      # the plan has to be there. jq is already on the runner.
      - name: Seed the demo plan
        run: bash scripts/demo/seed.sh

      # One person signs in and sees the plan. Everything above proves a part;
      # this is the only thing in the repository that proves the parts join up.
      - name: End to end
        run: npm run test:e2e
        working-directory: frontend

      # A failed run is worth more than its exit code: the report carries the
      # trace, the screenshot, and what the browser complained about.
      - name: Keep the report from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Show the containers' logs if anything failed
        if: failure()
        run: docker compose logs --tail=120

      - name: Stop the stack
        if: always()
        run: docker compose down -v
