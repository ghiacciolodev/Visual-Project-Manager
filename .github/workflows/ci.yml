name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest

    # No postgres service any more: the tests start their own through
    # Testcontainers, which the runner's Docker daemon provides. One database
    # per test run, torn down with it, and no second place where the version
    # has to be kept in step.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The executable bit on mvnw is routinely lost when committing from
      # Windows, and the Linux runner then cannot launch the wrapper.
      - name: Make the Maven wrapper executable
        run: chmod +x ./mvnw
        working-directory: backend

      - name: Build and test
        run: ./mvnw -B verify
        working-directory: backend

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # "npm ci" and not "npm install": it installs exactly what the lockfile
      # says and fails loudly when package.json and the lockfile disagree,
      # which is a real problem worth failing on rather than papering over.
      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # --watch=false because the builder watches by default, and a watching
      # test run on a CI runner is a job that never finishes.
      - name: Unit tests
        run: npm test -- --watch=false
        working-directory: frontend

      # Advisories are worth knowing about and are not worth failing a build
      # over at every severity: every one currently in the tree arrives through
      # @angular/build and @angular/cli, which are devDependencies and reach no
      # shipped file. The threshold is set where a finding would actually mean
      # something.
      - name: Audit dependencies
        run: npm audit --audit-level=critical
        working-directory: frontend

      - name: Production build
        run: npm run build
        working-directory: frontend

  images:
    name: Images (docker compose)
    runs-on: ubuntu-latest

    # Neither job above builds an image, so a broken Dockerfile or a stale
    # nginx configuration passed CI and failed on somebody's laptop. This
    # builds both and starts the stack far enough to know the containers come
    # up and answer.
    steps:
      - uses: actions/checkout@v4

      - name: Build the images
        run: docker compose build

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d

      # The backend waits on Keycloak's health check, which waits on its
      # database, so this is the whole chain in one assertion.
      - name: Wait for the API to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "API is up"; exit 0
            fi
            sleep 5
          done
          echo "API never came up"; docker compose logs --tail=80; exit 1

      # The security headers exist because they were verified against the built
      # image once. This is what keeps them verified.
      - name: Check the frontend's response headers
        run: |
          headers=$(curl -fsSI http://localhost:4200/)
          echo "$headers"
          for header in "content-security-policy" "x-content-type-options" \
                        "referrer-policy" "x-frame-options"; do
            echo "$headers" | grep -iq "^$header:" || { echo "missing $header"; exit 1; }
          done

      - name: Stop the stack
        if: always()
        run: docker compose down -v
