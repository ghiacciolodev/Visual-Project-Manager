name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest

    # The test generated by Spring Initializr boots the full application
    # context, and the context needs a datasource. Without this service
    # the pipeline fails on the very first push, for no obvious reason.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vpm
          POSTGRES_USER: vpm
          POSTGRES_PASSWORD: vpm_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vpm"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The executable bit on mvnw is routinely lost when committing from
      # Windows, and the Linux runner then cannot launch the wrapper.
      - name: Make the Maven wrapper executable
        run: chmod +x ./mvnw
        working-directory: backend

      - name: Build and test
        run: ./mvnw -B verify
        working-directory: backend
        env:
          POSTGRES_PASSWORD: vpm_local_dev

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # "npm ci" and not "npm install": it installs exactly what the
      # lockfile says, so the build is reproducible.
      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Production build
        run: npm run build
        working-directory: frontend